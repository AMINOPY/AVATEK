name: Android Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "foundation/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: Compile debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu runners already include the Android SDK.
      # Avoid setup-android's legacy "sdkmanager tools" bootstrap.
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
