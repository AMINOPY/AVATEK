name: Android Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "foundation/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: Compile debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build and test
        run: |
          set -o pipefail
          gradle --no-daemon --continue --console=plain :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log

      - name: Report compiler errors as annotations
        if: failure()
        run: |
          {
            grep -E "^e: |^w: .*(deprecat|Unresolved)|error:|FAILED|What went wrong|Execution failed|Unresolved reference|Caused by" build.log | head -150
          } > errors.txt || true
          MSG=$(python3 - <<'PY'
          import urllib.parse
          t = open("errors.txt").read()[:60000] or "no matching lines; tail:\n" + "".join(open("build.log").readlines()[-60:])
          print(t.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))
          PY
          )
          echo "::error title=Gradle errors::${MSG}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: avatek-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
